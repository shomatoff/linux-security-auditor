name: Quality and Linux package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-keysyms1 libxcb-icccm4 libxcb-image0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: QT_QPA_PLATFORM=offscreen python -m pytest -q
  build:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libxcb-keysyms1 libxcb-icccm4 libxcb-image0
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m PyInstaller --noconfirm --clean --onedir --name Linux-Security-Auditor main.py
      - run: QT_QPA_PLATFORM=offscreen dist/Linux-Security-Auditor/Linux-Security-Auditor --smoke-test
      - run: mkdir -p dist/packages && tar -C dist -czf dist/packages/Linux-Security-Auditor-Linux-x64.tar.gz Linux-Security-Auditor && cd dist/packages && sha256sum Linux-Security-Auditor-Linux-x64.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: linux-security-auditor-${{ github.sha }}
          path: dist/packages/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-security-auditor-${{ github.sha }}
          path: release
      - run: cd release && sha256sum -c SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
